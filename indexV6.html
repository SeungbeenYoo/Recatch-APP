.term{display:flex;align-items:center;justify-content:space-between;gap:8px}
.term .check{flex:1}
.term .req{font-size:12px;font-weight:700;color:var(--brand-ink);margin-right:2px}
.term .opt{font-size:12px;font-weight:700;color:var(--ink-3);margin-right:2px}
.view-btn{min-height:40px;padding:0 6px;font-size:13px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}

/* 권한 */
.perm-art{align-self:center;width:150px;height:150px;border-radius:40px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;margin:8px 0}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:18px}
.points li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;font-size:14px}
.points li+li{border-top:1px dashed var(--rule)}
.points .ic{width:28px;height:28px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.points b{display:block;font-size:14.5px}
.points small{color:var(--ink-3);font-size:12.5px}

/* 결과 */
.result{align-items:center;text-align:center}
.okc{width:76px;height:76px;border-radius:50%;background:var(--brand);color:var(--ink);display:grid;place-items:center;margin:28px auto 8px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.card{width:100%;background:var(--well);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ln&gt;span:first-child{color:var(--ink-3)}
.ln&gt;span:last-child{font-weight:700;text-align:right}
.idbig{font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:.02em;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--brand);display:grid;place-items:center;font-size:28px;font-weight:900;margin:24px auto 6px}
.notice{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--brand-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--brand-ink);font-weight:500}

/* 바텀시트·다이얼로그 */
.scrim{position:absolute;inset:0;background:rgba(30,21,11,.42);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.bsheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px 20px;max-height:80%;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.bsheet.on{transform:none;visibility:visible}
.bsheet .g{width:42px;height:5px;border-radius:9px;background:var(--rule);margin:2px auto 12px}
.bsheet h3{font-size:19px;font-weight:900;margin:0 0 10px;letter-spacing:-.02em}
.bsheet .doc{font-size:13.5px;color:var(--ink-2);background:var(--well);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.bsheet .doc p{margin:0 0 8px}
.bsheet .doc p:last-child{margin:0}
.dlg{position:absolute;left:50%;top:50%;z-index:32;width:calc(100% - 48px);transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;background:#FFFFFF;border-radius:26px;padding:22px 22px 12px;transition:all .2s;box-shadow:0 20px 50px rgba(30,21,11,.25)}
.dlg.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.dlg .dic{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;margin:0 auto 10px;font-family:var(--f-num);font-weight:800;position:relative}
.dlg .dic i{position:absolute;right:9px;bottom:10px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.dlg p{margin:0;text-align:center;font-size:15.5px;line-height:1.5}
.dlg p b{font-weight:700}
.dlg .sub{font-size:13px;color:var(--ink-3);margin-top:6px}
.dlg .acts{display:flex;flex-direction:column;margin-top:14px}
.dlg .acts button{min-height:46px;border-radius:12px;font-weight:700;color:#2C5BA8;text-align:center}
.dlg .acts button:active{background:#EEF3FB}

/* 헤드업 알림 (인증번호 문자) */
.hun{position:absolute;left:10px;right:10px;top:8px;z-index:60;background:#FFFFFF;border-radius:24px;padding:12px 14px;box-shadow:0 12px 30px rgba(30,21,11,.22);display:flex;flex-direction:column;gap:2px;text-align:left;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.1);width:auto}
.hun.on{transform:none}
.hun .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.hun .ai{width:20px;height:20px;border-radius:50%;background:#2D6BE4;color:#FFFFFF;display:grid;place-items:center}
.hun .at{font-size:14.5px;font-weight:700}
.hun .ab{font-size:13.5px;color:var(--ink-2)}
.hun .tap{font-size:12.5px;font-weight:700;color:var(--brand-ink);margin-top:2px}
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:rgba(40,32,24,.92);color:#FFFFFF;padding:11px 18px;border-radius:22px;font-size:14px;z-index:70;transition:all .3s;width:max-content;max-width:calc(100% - 32px);pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(30,21,11,.2);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 공통 도구 ---------- */
function setHelp(id,msg,state){const h=$(&#x27;#&#x27;+id+&#x27;-h&#x27;),w=$(`[data-wrap=&quot;${id}&quot;]`);if(h){h.textContent=msg||&#x27;&#x27;;h.className=&#x27;help&#x27;+(state?&#x27; &#x27;+state:&#x27;&#x27;)}if(w){w.classList.toggle(&#x27;bad&#x27;,state===&#x27;bad&#x27;);w.classList.toggle(&#x27;good&#x27;,state===&#x27;good&#x27;)}}
function toast(m){const t=$(&#x27;#toast&#x27;);t.textContent=m;t.classList.add(&#x27;on&#x27;);clearTimeout(t._h);t._h=setTimeout(()=&gt;t.classList.remove(&#x27;on&#x27;),2600)}
let hunT;function headsUp(title,body,tap,onTap){const h=$(&#x27;#hun&#x27;);h.innerHTML=`&lt;span class=&quot;ah&quot;&gt;&lt;span class=&quot;ai&quot; aria-hidden=&quot;true&quot;&gt;&lt;svg width=&quot;11&quot; height=&quot;11&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.6&quot;&gt;&lt;path d=&quot;M4 5h16v11H8l-4 4z&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;span&gt;메시지&lt;/span&gt;&lt;span&gt;· 지금&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;at&quot;&gt;${esc(title)}&lt;/span&gt;&lt;span class=&quot;ab&quot;&gt;${esc(body)}&lt;/span&gt;${tap?`&lt;span class=&quot;tap&quot;&gt;${esc(tap)}&lt;/span&gt;`:&#x27;&#x27;}`;
  h.onclick=()=&gt;{h.classList.remove(&#x27;on&#x27;);onTap&amp;&amp;onTap()};clearTimeout(hunT);requestAnimationFrame(()=&gt;h.classList.add(&#x27;on&#x27;));try{navigator.vibrate&amp;&amp;navigator.vibrate(40)}catch(_){}hunT=setTimeout(()=&gt;h.classList.remove(&#x27;on&#x27;),7000)}
function openSheet(title,html){$(&#x27;#bsTitle&#x27;).textContent=title;$(&#x27;#bsBody&#x27;).innerHTML=html;$(&#x27;#bsheet&#x27;).classList.add(&#x27;on&#x27;);$(&#x27;#scrim&#x27;).classList.add(&#x27;on&#x27;);$(&#x27;#screens&#x27;).inert=true;setTimeout(()=&gt;$(&#x27;#bsheet button&#x27;)?.focus(),50)}

let dlgCb=null;function dialog(html,actions){const d=$(&#x27;#dlg&#x27;);d.innerHTML=html+`&lt;div class=&quot;acts&quot;&gt;${actions.map((a,i)=&gt;`&lt;button data-dlg=&quot;${i}&quot;&gt;${esc(a[0])}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;dlgCb=actions.map(a=&gt;a[1]);d.classList.add(&#x27;on&#x27;);$(&#x27;#scrim&#x27;).classList.add(&#x27;on&#x27;);$(&#x27;#screens&#x27;).inert=true;setTimeout(()=&gt;d.querySelector(&#x27;button&#x27;).focus(),50)}
function closeDialog(){const d=$(&#x27;#dlg&#x27;);if(!d.classList.contains(&#x27;on&#x27;))return false;d.classList.remove(&#x27;on&#x27;);$(&#x27;#scrim&#x27;).classList.remove(&#x27;on&#x27;);$(&#x27;#screens&#x27;).inert=false;return true}
$(&#x27;#scrim&#x27;).onclick=()=&gt;{closeSheet()||closeDialog()};
$(&#x27;#dlg&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;[data-dlg]&#x27;);if(!b)return;const cb=dlgCb[+b.dataset.dlg];closeDialog();cb&amp;&amp;cb()});

/* 휴대폰 인증 (데모: 인증번호를 문자 알림으로 보여줌) */
const otp={};
function wirePhone(p,{check}={}){const ph=$(&#x27;#&#x27;+p+&#x27;Phone&#x27;),send=$(`[data-send=&quot;${p}&quot;]`),code=$(&#x27;#&#x27;+p+&#x27;Code&#x27;),ver=$(`[data-verify=&quot;${p}&quot;]`);
  otp[p]={verified:false};
  ph.addEventListener(&#x27;input&#x27;,()=&gt;{ph.value=fmtPhone(ph.value);send.disabled=!okPhone(ph.value)||otp[p].verified;setHelp(p+&#x27;Phone&#x27;,&#x27;&#x27;);if(otp[p].verified)return;otp[p].code=null});
  send.addEventListener(&#x27;click&#x27;,()=&gt;{if(!okPhone(ph.value)){setHelp(p+&#x27;Phone&#x27;,&#x27;휴대폰 번호를 확인해 주세요.&#x27;,&#x27;bad&#x27;);return}
    if(check){const err=check(digits(ph.value));if(err){setHelp(p+&#x27;Phone&#x27;,err,&#x27;bad&#x27;);return}}
    const c=String(Math.floor(100000+Math.random()*900000));otp[p].code=c;otp[p].exp=Date.now()+180000;

.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;width:100%;text-align:left}
.rows&gt;*+*{border-top:1px solid var(--line)}
.mk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-weight:700;font-size:13px;letter-spacing:-.03em;background:var(--m);box-shadow:0 0 0 3px var(--brand-soft)}
.mk.pic{box-shadow:0 0 0 1px rgba(30,21,11,.06),0 0 0 4px var(--brand-soft)}
.rmain{min-width:0;display:flex;flex-direction:column}
.rmain b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.ramt b{font-family:var(--f-num);font-size:15px;font-weight:700;white-space:nowrap}
.ramt small{font-family:var(--f-num);font-size:11px;color:var(--ink-3);white-space:nowrap}
.ramt .lost{color:var(--ink-3);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:1px}
.tag.done{background:var(--brand-soft);color:var(--brand-ink)}
.tag.pending{background:var(--pend-soft);color:var(--pend)}
.tag.missed{background:var(--miss-soft);color:var(--miss)}
.flash{animation:fl 2s ease}
@keyframes fl{0%,35%{background:var(--brand-soft)}100%{background:transparent}}
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;width:100%;text-align:left}
.todo b{display:block;font-size:14.5px;font-weight:700}
.todo small{font-size:12.5px;color:var(--ink-3)}
.todo em{font-style:normal;font-family:var(--f-num);font-weight:700;color:var(--brand-ink);font-size:13px}
.chev{color:var(--ink-3)}

/* history */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.tile small{font-size:11.5px;color:var(--ink-3)}
.tile b{font-family:var(--f-num);font-size:15px;font-weight:700;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--well);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:100%}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:99px;background:var(--well);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.chip[aria-selected=&quot;true&quot;]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day{font-family:var(--f-num);font-size:12px;color:var(--ink-3);padding:12px 0 2px;border-top:0!important}
.tx-d{margin:0 0 12px 54px;padding:12px 14px;background:var(--well);border:1px dashed var(--rule);border-radius:12px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.ln{display:flex;justify-content:space-between;gap:10px}
.ln&gt;span:first-child{color:var(--ink-2)}
.ln&gt;span:last-child{font-family:var(--f-num);white-space:nowrap}
.ln.total{border-top:1.5px dashed var(--rule);padding-top:8px;font-weight:700}
.ln.total&gt;span:first-child{color:var(--ink)}
.tx-d p{margin:0;font-size:12.5px;color:var(--ink-3)}
.empty{padding:36px 12px;text-align:center;color:var(--ink-3);font-size:14px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{text-align:left;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:14px}
.kpi small{font-size:12.5px;color:var(--ink-3)}
.kpi b{font-family:var(--f-num);font-size:24px;font-weight:800;letter-spacing:-.03em}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi .bar{background:rgba(255,255,255,.9)}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--ink-3);font-family:var(--f-body);font-size:11.5px}
.chart .val{fill:var(--ink-2);font-family:var(--f-num);font-size:10.5px}
.chart .val.cur{fill:var(--brand-ink);font-weight:700}
.chart .b{fill:var(--press)}
.chart .b.cur{fill:var(--brand)}
.chart .hit{fill:transparent;cursor:pointer}
.chart g:focus-visible .b{stroke:var(--ink);stroke-width:2}
.cats{display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.cat .nm{font-size:14.5px;font-weight:500}
.cat .nm small{color:var(--ink-3);margin-left:6px;font-family:var(--f-num);font-size:11.5px}
.cat b{font-family:var(--f-num);font-size:14px}
.cat .tr{grid-column:1/-1;height:8px;border-radius:99px;background:var(--press);overflow:hidden}
.cat .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rank{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.rank .no{font-family:var(--f-num);font-weight:700;color:var(--ink-3)}
.mini-card{width:40px;height:26px;border-radius:5px;background:var(--art)}
.rank b.v{font-family:var(--f-num);font-size:14px;color:var(--brand-ink)}

/* wallet */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-left:calc(-1*var(--gut));margin-right:calc(-1*var(--gut-r));padding:4px var(--gut-r) 4px var(--gut)}
.rail::-webkit-scrollbar{display:none}
.ccard{flex:0 0 84%;max-width:330px;aspect-ratio:1.586;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;scroll-snap-align:center;position:relative;overflow:hidden;color:var(--on,#FFFFFF);background:var(--art);box-shadow:0 10px 24px rgba(120,60,0,.18)}
.ccard .bank{font-size:12px;font-weight:700;opacity:.9}
.ccard .cname{font-size:19px;font-weight:900;letter-spacing:-.02em}
.ccard .chipi{width:36px;height:27px;border-radius:6px;background:#E8C77E;border:1px solid rgba(0,0,0,.18)}
.ccard .cno{font-family:var(--f-num);font-size:13.5px;letter-spacing:.1em}
.ccard .hint{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.22)}
.ccard .ring{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:24px solid rgba(255,255,255,.14)}
.ccard&gt;*:not(.ring){position:relative}
.rail-ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.dots{display:flex;gap:2px}
.dots button{width:24px;height:24px;display:grid;place-items:center}
.dots button::before{content:&quot;&quot;;width:6px;height:6px;border-radius:9px;background:rgba(30,21,11,.25);transition:width .25s,background .25s}
.dots button[aria-current=&quot;true&quot;]::before{width:18px;background:var(--ink)}
.sbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.panel .sbtn,.sheet .sbtn{background:var(--well);border:1px solid var(--line)}
.sbtn:disabled{opacity:.35;cursor:default}
.meta{display:flex;flex-direction:column;gap:10px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-brand{background:var(--brand);color:var(--ink)}
.btn-soft{background:var(--well);color:var(--ink);border:1px solid var(--line)}
.btn-glass{background:rgba(255,255,255,.7);color:var(--ink)}
.btn-danger{background:var(--miss-soft);color:var(--miss)}
.btn-block{width:100%;min-height:52px}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts button{min-height:40px;padding:0 12px;border-radius:10px;border:1px dashed var(--rule);background:var(--well);font-size:13.5px;font-weight:500}
.facts small{color:var(--ink-3);margin-left:4px;font-size:11.5px}

/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-top:6px;padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--card);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:700;color:var(--ink-3);text-align:center}
.tab .ti{width:44px;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current=&quot;page&quot;]{color:var(--ink)}
.tab[aria-current=&quot;page&quot;] .ti{background:var(--brand);color:var(--ink)}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:26px 26px 0 0;padding-bottom:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-height:90%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s .36s}
.sheet.on{transform:none;visibility:visible;transition:transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet.tall{height:86%}
.sheet.drag{transition:none}
.grab{margin:0 -20px 2px;padding:12px 0 10px;touch-action:none;cursor:grab}
.grab i{display:block;width:42px;height:5px;border-radius:9px;background:var(--rule);margin:0 auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-size:20px;font-weight:900;letter-spacing:-.03em}
.sheet .ibtn{background:var(--well);border:1px solid var(--line)}
.sheet-body{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;color:var(--ink-2);font-size:14px}
.slip{background:var(--well);border:1px dashed var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.slip .ln.total{font-size:16px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.trow+.trow{border-top:1px solid var(--line)}
.trow b{display:block;font-size:15px}
.trow small{color:var(--ink-3);font-size:12.5px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:&quot;&quot;;position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked=&quot;true&quot;]{background:var(--brand)}
.sw[aria-checked=&quot;true&quot;]::after{transform:translateX(20px)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--well);padding:0 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none}
.field input[aria-invalid=&quot;true&quot;]{border-color:var(--miss)}
fieldset.field{border:0;margin:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--well);border:1px solid var(--line);padding:4px;border-radius:13px}
.seg label{position:relative;height:40px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink-3);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 3px rgba(30,21,11,.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink)}
.err{color:var(--miss);font-size:13.5px;margin:0;min-height:20px}
.pass{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.pass-top{background:var(--pc);color:#FFFFFF;padding:14px 16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pass-top b{display:block;font-size:16px}
.pass-top small{font-size:12px;opacity:.9}
.pass-top span{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:7px;white-space:nowrap}
.code{background:#FFFFFF;color:#1E150B;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.code svg{width:100%}
.code .num{font-size:14px;letter-spacing:.12em;text-align:center}
.code p{margin:0;font-size:12px;color:#6B5C4B;text-align:center}
.pager{display:flex;align-items:center;justify-content:center;gap:12px}
.pager span{font-family:var(--f-num);font-size:13px;color:var(--ink-3);min-width:48px;text-align:center}

/* flow */
.flow{position:absolute;inset:0;z-index:40;display:none}
.flow.on{display:block}
.panel-f{position:absolute;inset:0;overflow-y:auto;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column}
.lock{background:linear-gradient(180deg,#FFE6C8 0%,#FDC27C 100%);color:#1E150B;align-items:center;padding-block:56px 24px;animation:fi .3s ease}
@keyframes fi{from{opacity:0}}
.lock .clock{font-family:var(--f-num);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.04em}
.lock .date{font-size:15px;color:#4F4234;margin-top:8px}
.lstack{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:8px}
.noti{width:100%;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;text-align:left;box-shadow:0 8px 24px rgba(120,60,0,.12);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both}
@keyframes dr{from{transform:translateY(-20px);opacity:0}}
.noti .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#FFFFFF}
.noti .hd{display:flex;justify-content:space-between;font-size:12px;color:#6B5C4B}
.noti .bd{font-size:14px;line-height:1.45}
.noti.rc{background:#FFFFFF;border:2px solid #1E150B;box-shadow:0 16px 40px rgba(120,60,0,.22);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both,nudge 2.4s 1.2s ease-in-out infinite}
.noti.rc .save{background:#FFEBD3;color:#9C4A00;padding:0 3px;border-radius:3px}
.noti.rc .tap{display:block;margin-top:5px;font-size:12.5px;font-weight:700;color:#9C4A00}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translateY(-3px)}92%{transform:translateY(1px)}}
.rc-ic{position:relative;background:#1E150B;font-family:var(--f-num);font-weight:800;font-size:15px}
.rc-ic i{position:absolute;right:7px;bottom:9px;width:5px;height:5px;border-radius:50%;background:#F98802}
.checks{width:100%;background:rgba(255,255,255,.6);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.checks .tt{display:flex;align-items:center;gap:8px;font-weight:700}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #E8D3BA;border-top-color:#1E150B;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ck{display:flex;align-items:center;gap:9px;opacity:.4;transition:opacity .3s}
.ck.ok{opacity:1}
.ck i{width:16px;height:16px;border-radius:50%;border:1.5px solid #8F7E6B;flex:none}
.ck.ok i{background:#F98802;border-color:#F98802}
.ck em{font-style:normal;color:#6B5C4B;margin-left:4px}
.lock .hint{margin-top:auto;padding-top:16px;font-size:12.5px;color:#4F4234}
.lock .x{position:absolute;top:14px;right:var(--gut-r)}
.pay{background:var(--card);padding-block:16px 20px;gap:14px;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.pay-h{display:flex;align-items:center;gap:12px}
.pay-h div{flex:1;min-width:0}
.pay-h b{display:block;font-size:15px}
.pay-h small{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.pay .ibtn{background:var(--well);border:1px solid var(--line)}
.pay-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(165deg,var(--hero-a),var(--hero-b));border-radius:22px;padding:16px}
.timer{position:relative;width:96px;height:96px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .tr{stroke:rgba(255,255,255,.75)}
.timer .tp{stroke:var(--ink);transition:stroke-dashoffset .25s linear}
.timer div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer b{font-family:var(--f-num);font-size:22px}
.timer small{font-size:11px;color:var(--ink-2)}
.pay-hero .badge{align-self:flex-start;font-size:12px;font-weight:700;background:var(--ink);color:var(--on-ink);padding:3px 9px;border-radius:8px}
.pay-hero h3{font-size:21px;font-weight:900;line-height:1.35;letter-spacing:-.03em;margin-top:6px}
.steps{list-style:none;margin:0;padding:0;background:var(--well);border:1px solid var(--line);border-radius:18px}
.steps li{display:flex;gap:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.steps li+li{border-top:1px dashed var(--rule)}
.steps .num{font-weight:700;color:var(--brand-ink)}
.acts{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.done-p{background:var(--card);align-items:center;text-align:center;padding-block:clamp(24px,8vh,72px) 20px;gap:6px;animation:fi .25s ease}
.done-p canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.done-p&gt;*:not(canvas){position:relative}
.okc{width:72px;height:72px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3)}}
.done-p h3{font-size:15px;color:var(--ink-2);font-weight:500;margin-top:14px}
.done-p .big{font-size:32px;font-weight:900;letter-spacing:-.04em;line-height:1.25}
.done-p .big .num{color:var(--brand-ink)}
.done-p .slip{width:100%;text-align:left;margin-top:16px}
.done-p .btn{margin-top:auto;width:100%}

/* One UI 잠금화면 알림 */
.lock .date{margin-top:0;font-size:16px;font-weight:500}
.lock .clock{font-weight:300;font-size:88px;margin-top:2px;letter-spacing:-.03em}
.anoti{width:100%;background:rgba(255,255,255,.9);border-radius:26px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 6px 18px rgba(120,60,0,.10);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both;cursor:default}
.anoti .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:#4F4234;margin-bottom:2px}
.anoti .ai{position:relative;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-family:var(--f-num);font-size:10px;font-weight:800;flex:none}
.anoti .ai i{position:absolute;right:3px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#F98802}
.anoti .at{font-size:14.5px;font-weight:700;color:#1E150B;line-height:1.45}
.anoti .ab{font-size:13.5px;line-height:1.45;color:#4F4234}
.anoti .save{background:#FFEBD3;color:#9C4A00;padding:0 3px;border-radius:3px}
.anoti .aacts{display:flex;gap:2px;margin:6px 0 0 -10px}
.anoti .aacts button{min-height:44px;padding:0 10px;border-radius:12px;font-size:14px;font-weight:700;color:#9C4A00}
.anoti .aacts button:active{background:#FFEBD3}
.anoti.rc{border:2px solid #F98802;cursor:pointer;animation:dr .45s cubic-bezier(.2,1.1,.3,1) both,nudge 2.4s 1.2s ease-in-out infinite}

.qmem{background:var(--well);border:1px solid var(--line);color:var(--ink)}
.qmem .mk{width:26px;height:26px;font-size:10px;border-radius:50%}

.qnote{margin:-2px 0 8px;font-size:12.5px;color:var(--ink-3)}
.qcard .qapp{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-body);font-size:11px;font-weight:700;opacity:.95}
.qmem .lockic{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--ink-3)}
/* 다음 결제엔 이 카드 */
.np{display:flex;flex-direction:column;gap:12px}
.np-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.np-chips::-webkit-scrollbar{display:none}
.np-chips button{flex:none;min-height:40px;padding:0 13px;border-radius:99px;background:var(--well);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.np-chips button[aria-selected=&quot;true&quot;]{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.np-best{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.np-best .cardmini{width:52px;height:34px;border-radius:7px;background:var(--art);box-shadow:0 4px 10px rgba(120,60,0,.18)}
.np-best b{display:block;font-size:15.5px}
.np-best small{display:block;font-size:12.5px;color:var(--ink-3)}
.np-best .pct{font-family:var(--f-num);font-weight:800;font-size:22px;color:var(--brand-ink);line-height:1.1}
.np-alt{font-size:12.5px;color:var(--ink-3);margin:0}
/* 다가오는 혜택 알림 */
.up{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.up .ui{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.up .ui.tel{background:var(--pend-soft);color:var(--pend)}
.up b{display:block;font-size:14.5px;font-weight:700}
.up small{display:block;font-size:12.5px;color:var(--ink-3)}
.up .minibar{height:6px;border-radius:9px;background:var(--press);margin-top:6px;overflow:hidden}
.up .minibar i{display:block;height:100%;background:var(--pend);border-radius:9px}
.dday{font-family:var(--f-num);font-size:11px;font-weight:700;background:var(--ink);color:var(--on-ink);padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.bell{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 11px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--well);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.bell[aria-pressed=&quot;true&quot;]{background:var(--brand);border-color:var(--brand);color:var(--ink)}
/* 안드로이드 헤드업 알림 */
.hun{position:absolute;left:10px;right:10px;top:8px;z-index:90;background:#FFFFFF;border-radius:24px;padding:12px 14px;box-shadow:0 12px 30px rgba(30,21,11,.22);display:flex;flex-direction:column;gap:2px;text-align:left;transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
.hun.on{transform:none}
.hun .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:#4F4234}
.hun .ai{position:relative;width:20px;height:20px;border-radius:50%;background:#1E150B;color:#FFFFFF;display:grid;place-items:center;font-family:var(--f-num);font-size:10px;font-weight:800}
.hun .ai i{position:absolute;right:3px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#F98802}
.hun .at{font-size:14.5px;font-weight:700;color:#1E150B}
.hun .ab{font-size:13px;color:#4F4234}
/* 카드사 앱 연결 */
.handoff{position:absolute;left:0;right:0;top:50%;z-index:85;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-50%) scale(.96);transition:opacity .2s,transform .2s}
.handoff.on{opacity:1;transform:translateY(-50%)}
.ho-pill{display:inline-flex;align-items:center;gap:10px;background:rgba(30,21,11,.88);color:#FFFFFF;font-size:15px;font-weight:700;padding:14px 20px;border-radius:99px;box-shadow:0 10px 26px rgba(30,21,11,.25)}
.ho-pill .spin{border-color:rgba(255,255,255,.3);border-top-color:#F98802}
/* 지문 인증 */
.bio{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 0}
.bio .fp{width:84px;height:84px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center}
.bio .fp.ok{background:var(--brand);color:var(--ink)}
.goal{display:flex;flex-direction:column;gap:8px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-top b{font-size:14.5px}
.goal-top span{font-family:var(--f-num);font-size:12.5px;color:var(--ink-3)}
.bar{height:10px;border-radius:99px;background:var(--press);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--brand);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i.part{background:var(--pend)}

/* rows */
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;width:100%;text-align:left}
.rows&gt;*+*{border-top:1px solid var(--line)}
.mk{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-weight:700;font-size:13px;letter-spacing:-.03em;background:var(--m);box-shadow:0 0 0 3px var(--brand-soft)}
.mk.pic{box-shadow:0 0 0 1px rgba(30,21,11,.06),0 0 0 4px var(--brand-soft)}
.rmain{min-width:0;display:flex;flex-direction:column}
.rmain b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.ramt b{font-family:var(--f-num);font-size:15px;font-weight:700;white-space:nowrap}
.ramt small{font-family:var(--f-num);font-size:11px;color:var(--ink-3);white-space:nowrap}
.ramt .lost{color:var(--ink-3);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;vertical-align:1px}
.tag.done{background:var(--brand-soft);color:var(--brand-ink)}
.tag.pending{background:var(--pend-soft);color:var(--pend)}
.tag.missed{background:var(--miss-soft);color:var(--miss)}
.flash{animation:fl 2s ease}
@keyframes fl{0%,35%{background:var(--brand-soft)}100%{background:transparent}}
.todo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;width:100%;text-align:left}
.todo b{display:block;font-size:14.5px;font-weight:700}
.todo small{font-size:12.5px;color:var(--ink-3)}
.todo em{font-style:normal;font-family:var(--f-num);font-weight:700;color:var(--brand-ink);font-size:13px}
.chev{color:var(--ink-3)}

/* history */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.tile small{font-size:11.5px;color:var(--ink-3)}
.tile b{font-family:var(--f-num);font-size:15px;font-weight:700;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--well);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:48px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;height:100%}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:99px;background:var(--well);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink-2)}
.chip[aria-selected=&quot;true&quot;]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.day{font-family:var(--f-num);font-size:12px;color:var(--ink-3);padding:12px 0 2px;border-top:0!important}
.tx-d{margin:0 0 12px 54px;padding:12px 14px;background:var(--well);border:1px dashed var(--rule);border-radius:12px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.ln{display:flex;justify-content:space-between;gap:10px}
.ln&gt;span:first-child{color:var(--ink-2)}
.ln&gt;span:last-child{font-family:var(--f-num);white-space:nowrap}
.ln.total{border-top:1.5px dashed var(--rule);padding-top:8px;font-weight:700}
.ln.total&gt;span:first-child{color:var(--ink)}
.tx-d p{margin:0;font-size:12.5px;color:var(--ink-3)}
.empty{padding:36px 12px;text-align:center;color:var(--ink-3);font-size:14px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{text-align:left;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:14px}
.kpi small{font-size:12.5px;color:var(--ink-3)}
.kpi b{font-family:var(--f-num);font-size:24px;font-weight:800;letter-spacing:-.03em}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi .bar{background:rgba(255,255,255,.9)}
.chart .grid{stroke:var(--line)}
.chart .axis{fill:var(--ink-3);font-family:var(--f-body);font-size:11.5px}
.chart .val{fill:var(--ink-2);font-family:var(--f-num);font-size:10.5px}
.chart .val.cur{fill:var(--brand-ink);font-weight:700}
.chart .b{fill:var(--press)}
.chart .b.cur{fill:var(--brand)}
.chart .hit{fill:transparent;cursor:pointer}
.chart g:focus-visible .b{stroke:var(--ink);stroke-width:2}
.cats{display:flex;flex-direction:column}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.cat .nm{font-size:14.5px;font-weight:500}
.cat .nm small{color:var(--ink-3);margin-left:6px;font-family:var(--f-num);font-size:11.5px}
.cat b{font-family:var(--f-num);font-size:14px}
.cat .tr{grid-column:1/-1;height:8px;border-radius:99px;background:var(--press);overflow:hidden}
.cat .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rank{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;width:100%;text-align:left}
.rank .no{font-family:var(--f-num);font-weight:700;color:var(--ink-3)}
.mini-card{width:40px;height:26px;border-radius:5px;background:var(--art)}
.rank b.v{font-family:var(--f-num);font-size:14px;color:var(--brand-ink)}

/* wallet */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-left:calc(-1*var(--gut));margin-right:calc(-1*var(--gut-r));padding:4px var(--gut-r) 4px var(--gut)}
.rail::-webkit-scrollbar{display:none}
.ccard{flex:0 0 84%;max-width:330px;aspect-ratio:1.586;border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;scroll-snap-align:center;position:relative;overflow:hidden;color:var(--on,#FFFFFF);background:var(--art);box-shadow:0 10px 24px rgba(120,60,0,.18)}
.ccard .bank{font-size:12px;font-weight:700;opacity:.9}
.ccard .cname{font-size:19px;font-weight:900;letter-spacing:-.02em}
.ccard .chipi{width:36px;height:27px;border-radius:6px;background:#E8C77E;border:1px solid rgba(0,0,0,.18)}
.ccard .cno{font-family:var(--f-num);font-size:13.5px;letter-spacing:.1em}
.ccard .hint{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.22)}
.ccard .ring{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;border:24px solid rgba(255,255,255,.14)}
.ccard&gt;*:not(.ring){position:relative}
.rail-ctl{display:flex;align-items:center;justify-content:center;gap:10px}
.dots{display:flex;gap:2px}
.dots button{width:24px;height:24px;display:grid;place-items:center}
.dots button::before{content:&quot;&quot;;width:6px;height:6px;border-radius:9px;background:rgba(30,21,11,.25);transition:width .25s,background .25s}
.dots button[aria-current=&quot;true&quot;]::before{width:18px;background:var(--ink)}
.sbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.panel .sbtn,.sheet .sbtn{background:var(--well);border:1px solid var(--line)}
.sbtn:disabled{opacity:.35;cursor:default}
.meta{display:flex;flex-direction:column;gap:10px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-brand{background:var(--brand);color:var(--ink)}
.btn-soft{background:var(--well);color:var(--ink);border:1px solid var(--line)}
.btn-glass{background:rgba(255,255,255,.7);color:var(--ink)}
.btn-danger{background:var(--miss-soft);color:var(--miss)}
.btn-block{width:100%;min-height:52px}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts button{min-height:40px;padding:0 12px;border-radius:10px;border:1px dashed var(--rule);background:var(--well);font-size:13.5px;font-weight:500}
.facts small{color:var(--ink-3);margin-left:4px;font-size:11.5px}

/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-top:6px;padding-bottom:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--card);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:700;color:var(--ink-3);text-align:center}
.tab .ti{width:44px;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current=&quot;page&quot;]{color:var(--ink)}
.tab[aria-current=&quot;page&quot;] .ti{background:var(--brand);color:var(--ink)}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:26px 26px 0 0;padding-bottom:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-height:90%;overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s .36s}
.sheet.on{transform:none;visibility:visible;transition:transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet.tall{height:86%}
.sheet.drag{transition:none}
.grab{margin:0 -20px 2px;padding:12px 0 10px;touch-action:none;cursor:grab}
.grab i{display:block;width:42px;height:5px;border-radius:9px;background:var(--rule);margin:0 auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h h3{font-size:20px;font-weight:900;letter-spacing:-.03em}
.sheet .ibtn{background:var(--well);border:1px solid var(--line)}
.sheet-body{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;color:var(--ink-2);font-size:14px}
.slip{background:var(--well);border:1px dashed var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.slip .ln.total{font-size:16px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.trow+.trow{border-top:1px solid var(--line)}
.trow b{display:block;font-size:15px}
.trow small{color:var(--ink-3);font-size:12.5px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:&quot;&quot;;position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked=&quot;true&quot;]{background:var(--brand)}
.sw[aria-checked=&quot;true&quot;]::after{transform:translateX(20px)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select{height:50px;border-radius:13px;border:1px solid var(--line);background:var(--well);padding:0 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none}
.field input[aria-invalid=&quot;true&quot;]{border-color:var(--miss)}
fieldset.field{border:0;margin:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--well);border:1px solid var(--line);padding:4px;border-radius:13px}
.seg label{position:relative;height:40px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--ink-3);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink)}
.seg label:has(input:checked){background:var(--card);box-shadow:0 1px 3px rgba(30,21,11,.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink)}
.err{color:var(--miss);font-size:13.5px;margin:0;min-height:20px}
.pass{border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.pass-top{background:var(--pc);color:#FFFFFF;padding:14px 16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pass-top b{display:block;font-size:16px}
.pass-top small{font-size:12px;opacity:.9}
.pass-top span{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:7px;white-space:nowrap}
.code{background:#FFFFFF;color:#1E150B;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.code svg{width:100%}
.code .num{font-size:14px;letter-spacing:.12em;text-align:center}
.code p{margin:0;font-size:12px;color:#6B5C4B;text-align:center}
.pager{display:flex;align-items:center;justify-content:center;gap:12px}
.pager span{font-family:var(--f-num);font-size:13px;color:var(--ink-3);min-width:48px;text-align:center}

/* flow */
.flow{position:absolute;inset:0;z-index:40;display:none}
.flow.on{display:block}
.panel-f{position:absolute;inset:0;overflow-y:auto;padding-left:var(--gut);padding-right:var(--gut-r);display:flex;flex-direction:column}
.lock{background:linear-gradient(180deg,#FFE6C8 0%,#FDC27C 100%);color:#1E150B;align-items:center;padding-block:56px 24px;animation:fi .3s ease}
@keyframes fi{from{opacity:0}}
.lock .clock{font-family:var(--f-num);font-weight:700;font-size:72px;line-height:1;letter-spacing:-.04em}
.lock .date{font-size:15px;color:#4F4234;margin-top:8px}
.lstack{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:8px}
.noti{width:100%;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;text-align:left;box-shadow:0 8px 24px rgba(120,60,0,.12);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both}
@keyframes dr{from{transform:translateY(-20px);opacity:0}}
.noti .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#FFFFFF}
.noti .hd{display:flex;justify-content:space-between;font-size:12px;color:#6B5C4B}
.noti .bd{font-size:14px;line-height:1.45}
.noti.rc{background:#FFFFFF;border:2px solid #1E150B;box-shadow:0 16px 40px rgba(120,60,0,.22);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both,nudge 2.4s 1.2s ease-in-out infinite}
.noti.rc .save{background:#FFEBD3;color:#9C4A00;padding:0 3px;border-radius:3px}
.noti.rc .tap{display:block;margin-top:5px;font-size:12.5px;font-weight:700;color:#9C4A00}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translateY(-3px)}92%{transform:translateY(1px)}}
.rc-ic{position:relative;background:#1E150B;font-family:var(--f-num);font-weight:800;font-size:15px}
.rc-ic i{position:absolute;right:7px;bottom:9px;width:5px;height:5px;border-radius:50%;background:#F98802}
.checks{width:100%;background:rgba(255,255,255,.6);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.checks .tt{display:flex;align-items:center;gap:8px;font-weight:700}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid #E8D3BA;border-top-color:#1E150B;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ck{display:flex;align-items:center;gap:9px;opacity:.4;transition:opacity .3s}
.ck.ok{opacity:1}
.ck i{width:16px;height:16px;border-radius:50%;border:1.5px solid #8F7E6B;flex:none}
.ck.ok i{background:#F98802;border-color:#F98802}
.ck em{font-style:normal;color:#6B5C4B;margin-left:4px}
.lock .hint{margin-top:auto;padding-top:16px;font-size:12.5px;color:#4F4234}
.lock .x{position:absolute;top:14px;right:var(--gut-r)}
.pay{background:var(--card);padding-block:16px 20px;gap:14px;animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.pay-h{display:flex;align-items:center;gap:12px}
.pay-h div{flex:1;min-width:0}
.pay-h b{display:block;font-size:15px}
.pay-h small{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.pay .ibtn{background:var(--well);border:1px solid var(--line)}
.pay-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(165deg,var(--hero-a),var(--hero-b));border-radius:22px;padding:16px}
.timer{position:relative;width:96px;height:96px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .tr{stroke:rgba(255,255,255,.75)}
.timer .tp{stroke:var(--ink);transition:stroke-dashoffset .25s linear}
.timer div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer b{font-family:var(--f-num);font-size:22px}
.timer small{font-size:11px;color:var(--ink-2)}
.pay-hero .badge{align-self:flex-start;font-size:12px;font-weight:700;background:var(--ink);color:var(--on-ink);padding:3px 9px;border-radius:8px}
.pay-hero h3{font-size:21px;font-weight:900;line-height:1.35;letter-spacing:-.03em;margin-top:6px}
.steps{list-style:none;margin:0;padding:0;background:var(--well);border:1px solid var(--line);border-radius:18px}
.steps li{display:flex;gap:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.steps li+li{border-top:1px dashed var(--rule)}
.steps .num{font-weight:700;color:var(--brand-ink)}
.acts{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.done-p{background:var(--card);align-items:center;text-align:center;padding-block:clamp(24px,8vh,72px) 20px;gap:6px;animation:fi .25s ease}
.done-p canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.done-p&gt;*:not(canvas){position:relative}
.okc{width:72px;height:72px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--ink);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3)}}
.done-p h3{font-size:15px;color:var(--ink-2);font-weight:500;margin-top:14px}
.done-p .big{font-size:32px;font-weight:900;letter-spacing:-.04em;line-height:1.25}
.done-p .big .num{color:var(--brand-ink)}
.done-p .slip{width:100%;text-align:left;margin-top:16px}
.done-p .btn{margin-top:auto;width:100%}

/* One UI 잠금화면 알림 */
.lock .date{margin-top:0;font-size:16px;font-weight:500}
.lock .clock{font-weight:300;font-size:88px;margin-top:2px;letter-spacing:-.03em}
.anoti{width:100%;background:rgba(255,255,255,.9);border-radius:26px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 6px 18px rgba(120,60,0,.10);animation:dr .45s cubic-bezier(.2,1.1,.3,1) both;cursor:default}
.anoti .ah{display:flex;align-items:center;gap:6px;font-size:12px;color:#4F4234;margin-bottom:2px}
.anoti .ai{position:relative;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-family:var(--f-num);font-size:10px;font-weight:800;flex:none}
.anoti .ai i{position:absolute;right:3px;bottom:4px;width:4px;height:4px;border-radius:50%;background:#F98802}
.anoti .at{font-size:14.5px;font-weight:700;color:#1E150B;line-height:1.45}
.anoti .ab{font-size:13.5px;line-height:1.45;color:#4F4234}
.anoti .save{background:#FFEBD3;color:#9C4A00;padding:0 3px;border-radius:3px}
.anoti .aacts{display:flex;gap:2px;margin:6px 0 0 -10px}
.anoti .aacts button{min-height:44px;padding:0 10px;border-radius:12px;font-size:14px;font-weight:700;color:#9C4A00}
.anoti .aacts button:active{background:#FFEBD3}
.anoti.rc{border:2px solid #F98802;cursor:pointer;animation:dr .45s cubic-bezier(.2,1.1,.3,1) both,nudge 2.4s 1.2s ease-in-out infinite}

.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,16px);opacity:0;background:rgba(40,32,24,.9);color:#FFFFFF;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;z-index:60;transition:all .3s cubic-bezier(.2,.8,.2,1);width:max-content;max-width:calc(100% - 32px);pointer-events:none;line-height:1.4}
.toast.on{opacity:1;transform:translate(-50%,0)}
